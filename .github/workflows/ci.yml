name: CI - Test & Validate

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Run Tests (Ubuntu)
    runs-on: ubuntu-latest

    # Prep Postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: simonpro_test
        ports:
          - 5432:5432
        # Make sure db ready before testing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Install xvfb
        # Install virtual framebuffer so PyQt wont crash in headless
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1 libgl1 libxcb-cursor0

      - name: Run Pytest
        env:
          # DB credential
          DB_HOST: localhost
          DB_USER: admin
          DB_PASSWORD: password123
          DB_NAME: simonpro_test
          DB_PORT: 5432
          QT_DEBUG_PLUGINS: "1"
        # xvfb-run to exec pytest so PyQt can render UI in background process
        run: xvfb-run -a uv run pytest tests/ -v
