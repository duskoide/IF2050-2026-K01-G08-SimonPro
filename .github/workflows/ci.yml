name: CI/CD - Test & Release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Install Ruff
        run: uv sync --only-group dev
      - name: Run Ruff Check
        run: uv run ruff check .

  test:
    name: Run Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: simonpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Install xvfb & OS Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 x11-utils libegl1 libgl1 libxcb-cursor0 postgresql-client

      - name: Init Database Schema
        env:
          PGPASSWORD: password123
        run: psql -h localhost -U admin -d simonpro_test -f database/init.sql

      - name: Run Tests with Coverage
        env:
          DB_HOST: localhost
          DB_USER: admin
          DB_PASSWORD: password123
          DB_NAME: simonpro_test
          DB_PORT: 5432
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  delivery:
    name: Release & Delivery
    runs-on: ubuntu-latest
    needs: test
    # Trigger on push to main/master OR tag push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Package
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          git archive --format=zip --output="dist/simonpro-${VERSION}.zip" HEAD
          sha256sum "dist/simonpro-${VERSION}.zip" > "dist/simonpro-${VERSION}.sha256"
          echo "Release packaged: simonpro-${VERSION}.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          body: |
            ## SiMonPro Release ${{ github.ref_name }}
            
            Automated release generated by CI/CD pipeline.
            
            ### Changes
            See commit history for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Branch Build)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: simonpro-build-${{ github.ref_name }}-${{ github.sha }}
          path: dist/

